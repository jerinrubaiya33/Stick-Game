<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lily Pad Jump — Rhythm Bloom</title>
    <link rel="stylesheet" href="stick.css">
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="hud-dashboard">
        <div class="hud-stat">
            <span class="hud-label">Score</span>
            <span id="score">0</span>
        </div>
        <div class="hud-divider"></div>
        <div class="hud-stat">
            <span class="hud-label">Blossoms</span>
            <span id="petal-count">0</span>
        </div>
        <div class="hud-divider"></div>
        <div class="hud-stat">
            <span class="hud-label">Best</span>
            <span id="best-score">0</span>
        </div>
    </div>

    <div id="combo-badge">Combo 1x</div>

    <div id="cosmetic-shop">
        <span class="shop-title">Select Uniform</span>
        <div class="shop-options">
            <button class="shop-btn active" id="btn-frog">Frog Cap</button>
            <button class="shop-btn" id="btn-sakura">Sakura (5🌸)</button>
        </div>
    </div>
    
    <div id="control-panel">
        <div id="instruction-text">Hold to extend vine. Tap exactly when the target ring matches the blooming lotus!</div>
        <button id="restart-action">RESTART SESSION</button>
    </div>
    
    <div id="perfect-toast">PERFECT BLOOM HARVEST</div>

    <script src="stick.js"></script>
</body>
</html>
